    <!-- Черновик сообщения ассистенту со страницы linkeon.io (#draft=…) и вопрос с поля (#ask=…):
         забрать в localStorage и стереть из адреса ДО Метрики — вебвизор пишет
         адрес страницы, и данные рождения в нём ушли бы в Метрику. Формат
         записи и чтение — src/utils/pendingDraft.ts, тест — draftCapture.test.ts. -->
    <script data-draft-capture>
      (function () {
        try {
          // Просроченная или битая запись иначе ждёт прихода в чат
          // (takePendingDraftFor) или выхода из аккаунта — гость, который
          // больше не открывал чат, носил бы её в localStorage навсегда, и
          // час из pendingDraft.ts был бы сроком «кто ещё читает», а не
          // сроком удаления. Чистим при каждом заходе, до разбора #draft=.
          var oldRaw = localStorage.getItem('pending_draft');
          if (oldRaw) {
            var old = null;
            try { old = JSON.parse(oldRaw); } catch (e) { old = null; }
            if (!old || !(old.expires > Date.now())) {
              localStorage.removeItem('pending_draft');
            }
          }
          var hash = location.hash;
          // #ask= — вопрос с поля на linkeon.io: проба без входа отправит его
          // сама (spec 2026-10-30-guest-trial). #draft= — только подставить.
          var auto = hash.indexOf('#ask=') === 0;
          if (!auto && hash.indexOf('#draft=') !== 0) return;
          // Сначала стереть: битый или длинный черновик тоже не должен
          // остаться в адресе.
          history.replaceState(history.state, '', location.pathname + location.search);
          var text = decodeURIComponent(hash.slice(auto ? 5 : 7)).trim();
          var assistant = (new URLSearchParams(location.search).get('assistant') || '').trim();
          if (!text || text.length > 600 || !assistant) return;
          localStorage.setItem('pending_draft', JSON.stringify({
            text: text,
            assistant: assistant,
            expires: Date.now() + 3600000,
            auto: auto
          }));
        } catch (e) { /* битый черновик отбрасывается */ }
      })();
    </script>

    <!-- Ранний запрос конфигурации пробы без входа (I1, ревью качества
         B9-fix, spec 2026-10-30-guest-trial): без него каждый новый
         посетитель /chat в режиме «вкл» ждал бы сетевой круг (до 4 с при
         сбое) перед экраном входа — спека «Выкат», шаг 1, обещает «для людей
         ничего не меняется». Запрос уходит здесь, пока бандл ещё грузится;
         fetchGuestConfig (src/components/guest/guestApi.ts) забирает
         window.__guestConfigPrefetch один раз и удаляет его, разбирает так
         же, как обычный ответ, с тем же потолком GUEST_CONFIG_TIMEOUT_MS —
         нет префетча, обычный запрос. Условия — те же, что у decideUnauthEntry
         (src/components/guest/decideUnauthEntry.ts), но проверены руками: тот
         модуль вместе со всем бандлом ещё не загружен в момент разбора этого
         script. Тест — guestConfigPrefetch.test.ts, как у data-draft-capture. -->
    <script data-guest-config-prefetch>
      (function () {
        try {
          // T10 (хвост по перепроверкам B9-fix, 31.10): в нативной сборке
          // (Capacitor) проба выключена правилом на бэке (decideUnauthEntry
          // уводит native на экран входа) — запрос уйдёт, но его результат
          // никто не прочитает: лишний сетевой вызов при каждом запуске.
          if (window.Capacitor) return;
          if (localStorage.getItem('jwt_access_token') || localStorage.getItem('linkeon_has_account')) return;
          var path = location.pathname.replace(/\/+$/, '') || '/';
          if (path !== '/' && path !== '/chat') return;
          window.__guestConfigPrefetch = fetch('/webhook/guest/config', { credentials: 'same-origin' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        } catch (e) { /* без сети не ломаем загрузку страницы */ }
      })();
    </script>

    <!-- Ранний маяк прихода в приложение (app_page_hit): срабатывает при разборе
         HTML, ДО загрузки тяжёлого бандла, через sendBeacon — поэтому фиксирует
         даже тех, кто ушёл во время загрузки JS. Только для рекламного трафика
         (utm/ref/seg), один раз на сессию. Тот же session_id, что у eventsClient
         → воронку app_page_hit→landing_view→otp→signup можно склеить по сессии.
         Нужно, чтобы отличить «не доехал до app» от «доехал, но отвалился на загрузке». -->
    <script type="text/javascript">
      (function () {
        try {
          var p = new URLSearchParams(location.search);
          var src = 'direct';
          if (p.get('utm_source') || p.get('utm_campaign')) {
            src = 'utm:' + (p.get('utm_source') || p.get('utm_campaign'));
            if (p.get('utm_medium')) src += '/' + p.get('utm_medium');
          } else if (p.get('ref')) {
            src = 'referral:' + p.get('ref');
          }
          if (src === 'direct' && !p.get('seg')) return; // шумим только на рекламном трафике
          var KEY = 'linkeon_app_hit';
          if (sessionStorage.getItem(KEY)) return;
          sessionStorage.setItem(KEY, '1');
          var sid = sessionStorage.getItem('linkeon_session_id');
          if (!sid) {
            sid = 's_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
            sessionStorage.setItem('linkeon_session_id', sid);
          }
          var body = JSON.stringify({
            name: 'app_page_hit',
            sessionId: sid,
            source: src,
            props: {
              seg: p.get('seg') || null,
              campaign: [p.get('utm_campaign'), p.get('utm_content')].filter(Boolean).join('/') || null
            }
          });
          if (navigator.sendBeacon) {
            navigator.sendBeacon('/webhook/events/track', new Blob([body], { type: 'application/json' }));
          } else {
            fetch('/webhook/events/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true });
          }
        } catch (e) { /* маяк не ломает загрузку */ }
      })();
    </script>
